services:
  fmb-app:
    container_name: fmb-app
    image: ghcr.io/chernykh-dev/fmb-api
    ports:
      - "8080:8080" # Http
      - "8081:8081" # Https
    depends_on:
      fmb-db:
        condition: service_healthy
      fmb-redis:
        condition: service_healthy
    env_file:
      - .env.test
    restart: always

  fmb-db:
    container_name: fmb-db
    image: postgres:16
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  fmb-redis:
    container_name: fmb-redis
    image: redis:7.4-alpine
    restart: always
    # Cache only (PostgreSQL holds the truth): no persistence, bounded memory, evict keys with TTL first.
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: ghcr.io/chernykh-dev/fmb-nginx
    ports:
      - "80:80"
    depends_on:
      - fmb-app
    restart: always
    networks:
      - default
      # PR preview stands (docker/docker-compose.preview.yaml) join it too.
      - fmb-preview

volumes:
  pgdata:

networks:
  fmb-preview:
    external: true