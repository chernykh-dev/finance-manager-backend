events {}

http {
  upstream api {
    server fmb-app:8080;
  }

  server {
    listen 80;
    server_name yourflow.pro www.yourflow.pro;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # PR preview stands: fmb-<N>.yourflow.pro -> container fmb-pr-<N>-app (docker/preview.sh).
  server {
    listen 80;
    server_name ~^fmb-(?<pr>\d+)\.yourflow\.pro$;

    # Docker DNS; resolved per request, so stands can come and go without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
      set $preview_upstream http://fmb-pr-$pr-app:8080;
      proxy_pass $preview_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_intercept_errors off;
      error_page 502 503 504 = @stand_down;
    }

    location @stand_down {
      default_type text/plain;
      return 404 "Stand fmb-$pr is not running. Add the 'preview' label to PR #$pr to start it.\n";
    }
  }
}
